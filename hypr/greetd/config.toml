# hyprminimal: greetd config with autologin into the hyprminimal lock screen.
# Installed by: sudo bin/hyprminimal-autologin enable   (removed by: ... disable)
[terminal]
vt = 1

# boot: log in as jasur without a password; Hyprland then shows hyprlock first
# (see ~/.config/hypr/startup.lua, HYPRMINIMAL_AUTOLOGIN). Runs once per boot only.
[initial_session]
command = "env HYPRMINIMAL_AUTOLOGIN=1 /usr/bin/start-hyprland"
user = "jasur"

# after logging out: the hyprminimal greeter (installed by: sudo bin/hyprminimal-greeter install)
[default_session]
command = "env XDG_CACHE_HOME=/var/cache/hyprminimal-greeter XDG_DATA_HOME=/var/cache/hyprminimal-greeter XDG_STATE_HOME=/var/cache/hyprminimal-greeter start-hyprland -- -c /usr/local/share/hyprminimal-greeter/hyprland.lua"
user = "greeter"
