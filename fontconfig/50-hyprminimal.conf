<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- hyprminimal: Noto everywhere. Installed by install.sh to ~/.config/fontconfig/conf.d/ (a link to this file).
     Apps asking for a generic family (sans-serif, serif, monospace) get Noto first. -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Noto Sans Mono</family></prefer></alias>
</fontconfig>
