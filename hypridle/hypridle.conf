# Same as your Noctalia idle settings: no auto lock/suspend, only lock before sleep.
general {
    lock_cmd = pidof hyprlock || $HOME/.local/share/hyprminimal/bin/hyprminimal-msg lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
