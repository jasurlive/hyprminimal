# hyprminimal lock screen (Tokyo Night Moon)
$primary  = rgb(7a88cf)
$second   = rgb(d7729f)
$surface  = rgb(1f2335)
$text     = rgb(c0caf5)
$muted    = rgb(a9b1d6)
$error    = rgb(f7768e)
$font     = Noto Sans

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

auth {
    fingerprint:enabled = true
}

# plain theme colour, like the desktop: no image, no blur
background {
    monitor =
    color = rgb(222436)
}

# clock
label {
    monitor =
    text = cmd[update:1000] date +"<b>%H:%M</b>"
    color = rgba(c0caf5f2)
    font_size = 120
    font_family = $font Bold
    position = 0, 220
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"<b>%A, %d %B</b>"
    color = rgba(a9b1d6d9)
    font_size = 18
    font_family = $font Bold
    position = 0, 105
    halign = center
    valign = center
}

# login card
shape {
    monitor =
    size = 460, 150
    color = $surface
    rounding = 0
    border_size = 1
    border_color = rgb(4b517a)
    position = 0, -90
    halign = center
    valign = center
}

label {
    monitor =
    text = <b>󰌾   $USER</b>
    color = $text
    font_size = 15
    font_family = $font Bold, Symbols Nerd Font
    position = 0, -45
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 380, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgb(4b517a)
    inner_color = rgb(2c314a)
    font_color = $text
    check_color = $primary
    fail_color = $error
    capslock_color = rgb(e6c384)
    fade_on_empty = false
    font_family = $font Bold
    placeholder_text = <span foreground="##a9b1d6" weight="bold">Password…</span>
    fail_text = <span foreground="##f7768e" weight="bold">$FAIL ($ATTEMPTS)</span>
    rounding = 0
    position = 0, -115
    halign = center
    valign = center
}
