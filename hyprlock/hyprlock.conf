# hyprminimal lock screen (Tokyo Night Moon)
$primary  = rgb(7a88cf)
$second   = rgb(d7729f)
$surface  = rgba(1f2335cc)
$text     = rgb(c0caf5)
$muted    = rgb(a9b1d6)
$error    = rgb(f7768e)
$font     = Noto Sans

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

auth {
    fingerprint:enabled = true
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/wallhaven-ox36l9_3840x2160.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.7
    contrast = 1.0
    vibrancy = 0.2
}

# clock
label {
    monitor =
    # bold, no shadow/outline: clean on any wallpaper (the background is blurred and dimmed)
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(c0caf5f2)
    font_size = 120
    font_family = $font Bold
    position = 0, 220
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(a9b1d6d9)
    font_size = 18
    font_family = $font Bold
    position = 0, 105
    halign = center
    valign = center
}

# login card
shape {
    monitor =
    size = 460, 150
    color = $surface
    rounding = 0
    border_size = 1
    border_color = rgb(4b517a)
    position = 0, -90
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌾   $USER
    color = $text
    font_size = 15
    font_family = $font Bold, Symbols Nerd Font
    position = 0, -45
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 380, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgb(4b517a)
    inner_color = rgb(2c314a)
    font_color = $text
    check_color = $primary
    fail_color = $error
    capslock_color = rgb(e6c384)
    fade_on_empty = false
    font_family = $font Bold
    placeholder_text = <span foreground="##a9b1d6" weight="bold">Password…</span>
    fail_text = <span foreground="##f7768e" weight="bold">$FAIL ($ATTEMPTS)</span>
    rounding = 0
    position = 0, -115
    halign = center
    valign = center
}
