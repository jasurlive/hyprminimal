# hyprminimal kitty config
# Installed by install.sh to ~/.config/kitty/kitty.conf. Yours to edit: re-running install.sh keeps it.
# Colours live in the repo (kitty/colors.conf) so palette updates reach the terminal too.

include ~/.local/share/hyprminimal/kitty/colors.conf

shell bash
font_family Noto Sans
font_size 20

cursor_shape block
cursor_blink_interval 0

confirm_os_window_close 0
enable_audio_bell no
hide_window_decorations yes
tab_bar_edge bottom
