# hyprminimal kitty defaults (repo-owned, updated with the repo).
# ~/.config/kitty/kitty.conf includes this first; put your own changes there, below the include.

include ~/.local/share/hyprminimal/kitty/colors.conf

shell bash
font_family Noto Sans Mono
font_size 20

cursor_shape block
cursor_blink_interval 0

confirm_os_window_close 0
enable_audio_bell no
hide_window_decorations yes
tab_bar_edge bottom
